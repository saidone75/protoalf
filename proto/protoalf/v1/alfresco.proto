syntax = "proto3";
package protoalf.v1;
option java_package = "org.saidone.protoalf.api";
option java_multiple_files = true;

// Services follow the corresponding Alfresco repository APIs. Protobuf DTOs replace local Java objects.
service AuthenticationService {
 // Authenticates and returns the ticket of the authenticated user in the same call.
 rpc Authenticate(LoginRequest) returns (LoginResponse);
}

service NodeService {
 rpc GetProperties(NodeRefRequest) returns (NodeProperties);
 rpc AddProperties(AddPropertiesRequest) returns (Node);
 rpc GetType(NodeRefRequest) returns (NodeType);
 rpc SetType(SetTypeRequest) returns (Node);
 rpc GetAspects(NodeRefRequest) returns (NodeAspects);
 rpc AddAspect(AddAspectRequest) returns (Node);
 rpc RemoveAspect(RemoveAspectRequest) returns (Node);
 rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
 // Convenience extensions: snapshot and atomic metadata update across several Alfresco operations.
 rpc GetNode(GetNodeRequest) returns (Node);
 rpc UpdateNode(UpdateNodeRequest) returns (Node);
}

service NodeArchiveService {
 rpc ListArchivedNodes(ListArchivedNodesRequest) returns (ListArchivedNodesResponse);
 rpc PurgeArchivedNode(PurgeArchivedNodeRequest) returns (PurgeArchivedNodesResponse);
 // Purges every archived node the caller can list (all of them for an administrator).
 rpc PurgeAllArchivedNodes(PurgeAllArchivedNodesRequest) returns (PurgeArchivedNodesResponse);
}

service FileFolderService {
 rpc List(ListChildrenRequest) returns (ListChildrenResponse);
 rpc Create(CreateNodeRequest) returns (Node);
 rpc Move(MoveNodeRequest) returns (Node);
 rpc Copy(CopyNodeRequest) returns (Node);
}

service ContentService {
 // Remote adaptations: materialize a reader slice or write supplied bytes, rather than return local Java handles.
 rpc GetReader(GetContentRequest) returns (GetContentResponse);
 rpc GetWriter(UpdateContentRequest) returns (Node);
 // Streaming extensions for downloads and creation of large documents.
 rpc DownloadContent(DownloadContentRequest) returns (stream DownloadContentResponse);
 rpc UploadContent(stream UploadContentRequest) returns (Node);
}

service VersionService {
 rpc GetVersionHistory(ListVersionsRequest) returns (ListVersionsResponse);
}

service SearchService {
 rpc Query(SearchRequest) returns (SearchResponse);
}

service DictionaryService {
 // Optional model/prefix filter and property expansion are remote convenience parameters.
 rpc GetAllModels(ListModelsRequest) returns (ListModelsResponse);
 rpc GetModel(ListModelsRequest) returns (ModelInfo);
}

// Common: node, properties and their values
message Node { string node_ref = 1; string name = 2; string type = 3; repeated string aspects = 4; map<string, Property> properties = 5; string parent_ref = 6; }
// Writes require exactly one scalar (including explicit null) or an explicitly multi-valued list.
// Cardinality and value kinds must match the repository dictionary; omitted properties are unchanged.
message Property { repeated PropertyValue values = 1; bool multi_valued = 2; }
message PropertyValue {
 oneof value {
  string string_value = 1; int64 integer_value = 2; double double_value = 3;
  bool boolean_value = 4; int64 timestamp_millis = 5; string node_ref_value = 6;
  ContentMetadata content_value = 7; string qname_value = 8; bool null_value = 9;
 }
}
message ContentMetadata { string mimetype = 1; string encoding = 2; int64 size = 3; string locale = 4; }
message Content { bytes data = 1; string mimetype = 2; string encoding = 3; }

// AuthenticationService
message LoginRequest { string user = 1; string password = 2; }
message LoginResponse { string ticket = 1; }

// Write requests use typed properties; former text-map/list field numbers are reserved, not reused.
// NodeService
message GetNodeRequest { string node_ref = 1; }
message UpdateNodeRequest { reserved 3, 5; reserved "property_values"; string node_ref = 1; string name = 2; string type = 4; repeated string add_aspects = 6; repeated string remove_aspects = 7; map<string, Property> properties = 8; }
message DeleteNodeRequest { string node_ref = 1; }
message DeleteNodeResponse { }

// NodeArchiveService
message ListArchivedNodesRequest { string filter = 1; int32 skip_count = 2; int32 max_items = 3; }
message ListArchivedNodesResponse { repeated Node entries = 1; bool has_more_items = 2; int64 total_items = 3; }
message PurgeArchivedNodeRequest { string node_ref = 1; }
message PurgeAllArchivedNodesRequest { }
message PurgeArchivedNodesResponse { int64 purged = 1; }

// FileFolderService
message ListChildrenRequest { string node_ref = 1; int32 skip_count = 2; int32 max_items = 3; }
message ListChildrenResponse { repeated Node entries = 1; bool has_more_items = 2; int64 total_items = 3; }
message CreateNodeRequest { reserved 4, 6; reserved "property_values"; string parent_ref = 1; string name = 2; string type = 3; Content content = 5; repeated string aspects = 7; map<string, Property> properties = 8; }
message MoveNodeRequest { string node_ref = 1; string target_parent_ref = 2; string name = 3; }
message CopyNodeRequest { string node_ref = 1; string target_parent_ref = 2; string name = 3; }

// SearchService
message SearchRequest { string query = 1; string language = 2; int32 skip_count = 3; int32 max_items = 4; repeated SortField sort = 5; }
message SortField { string field = 1; bool descending = 2; }
message SearchResponse { repeated Node entries = 1; bool has_more_items = 2; int64 total_items = 3; }

// ContentService
// Text offsets must be UTF-8 character boundaries; max_bytes is a strict byte limit.
// Offsets inside characters and limits too small for the first character yield INVALID_ARGUMENT.
message GetContentRequest { string node_ref = 1; bool text = 2; int64 offset = 3; int32 max_bytes = 4; }
message GetContentResponse { Content content = 1; int64 size = 2; bool has_more = 3; }
message DownloadContentRequest { string node_ref = 1; }
message DownloadContentResponse { oneof part { ContentInfo info = 1; bytes data = 2; } }
message ContentInfo { string mimetype = 1; string encoding = 2; int64 size = 3; }
message UpdateContentRequest { string node_ref = 1; Content content = 2; }
message UploadContentRequest { oneof part { CreateDocumentHeader header = 1; bytes data = 2; } }
message CreateDocumentHeader { reserved 4, 7; reserved "property_values"; string parent_ref = 1; string name = 2; string type = 3; string mimetype = 5; string encoding = 6; repeated string aspects = 8; map<string, Property> properties = 9; }

// VersionService
message ListVersionsRequest { string node_ref = 1; }
message ListVersionsResponse { repeated VersionInfo versions = 1; }
message VersionInfo { string label = 1; string version_ref = 2; bool major = 3; string description = 4; int64 modified_millis = 5; string modifier = 6; Node node = 7; }

// DictionaryService
message ListModelsRequest { string model = 1; bool include_properties = 2; }
message ListModelsResponse { repeated ModelInfo models = 1; }
message ModelInfo { string name = 1; string description = 2; repeated NamespaceInfo namespaces = 3; repeated ClassInfo types = 4; repeated ClassInfo aspects = 5; }
message NamespaceInfo { string prefix = 1; string uri = 2; }
message ClassInfo { string name = 1; string title = 2; string parent = 3; repeated string mandatory_aspects = 4; repeated PropertyInfo properties = 5; }
message PropertyInfo { string name = 1; string title = 2; string data_type = 3; bool mandatory = 4; bool multi_valued = 5; bool read_only = 6; }

// NodeService primitives: names and parameters mirror Alfresco's NodeService.
message NodeRefRequest { string node_ref = 1; }
message NodeProperties { map<string, Property> properties = 1; }
message NodeType { string type = 1; }
message NodeAspects { repeated string aspects = 1; }
message AddPropertiesRequest { reserved 2, 3; reserved "property_values"; string node_ref = 1; map<string, Property> properties = 4; }
message SetTypeRequest { string node_ref = 1; string type = 2; }
message AddAspectRequest { reserved 3, 4; reserved "property_values"; string node_ref = 1; string aspect = 2; map<string, Property> properties = 5; }
message RemoveAspectRequest { string node_ref = 1; string aspect = 2; }
