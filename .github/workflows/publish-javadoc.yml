name: Deploy Javadoc

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-javadoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Generate and publish Javadoc
        uses: MathieuSoysal/Javadoc-publisher.yml@v3.0.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          javadoc-branch: javadoc
          java-version: '21'
          java-distribution: temurin
          target-folder: javadoc
          project: maven
          custom-command: mvn --batch-mode --no-transfer-progress -DskipTests clean package javadoc:aggregate
          javadoc-source-folder: target/reports/apidocs
