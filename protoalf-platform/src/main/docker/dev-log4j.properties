# Development overrides for Alfresco 7.0 (log4j 1.2), merged over its log4j.properties.
# Alfresco 7.1+ / 23.x reads dev-log4j2.properties instead.

# Platform module: every gRPC call (method, user, status, duration) and diagnostic details
log4j.logger.org.saidone.protoalf.platform=debug

# Shaded gRPC/Netty/protobuf (relocated under the module package): only problems
log4j.logger.org.saidone.protoalf.platform.internal=warn
