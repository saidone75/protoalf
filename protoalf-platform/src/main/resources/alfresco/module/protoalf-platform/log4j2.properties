# Module logging for Alfresco 7.1+ / 23.x (log4j 2); Alfresco 7.0 reads log4j.properties instead
# Lifecycle, rejected tickets and failures at info; set to debug to log every gRPC call
logger.protoalf-platform.name=org.saidone.protoalf.platform
logger.protoalf-platform.level=info

# Shaded gRPC/Netty/protobuf (relocated under the module package): only problems
logger.protoalf-platform-internal.name=org.saidone.protoalf.platform.internal
logger.protoalf-platform-internal.level=warn
